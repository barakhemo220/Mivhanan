<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <rect width="700" height="380" rx="12" fill="#0f172a" />
  <rect x="1" y="1" width="698" height="378" rx="11" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Title Badge -->
  <rect x="20" y="15" width="280" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="160" y="35" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">מדידת טמפרטורה: RTD Pt100 בחיבור 3-חוטים</text>

  <!-- Left: RTD Sensor Probe in Thermowell -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="180" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="90" y="25" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">חיישן RTD (Pt100) בשטח</text>
    
    <!-- Sheath / Stem -->
    <rect x="80" y="45" width="20" height="150" fill="url(#metalGrad)" stroke="#cbd5e1" stroke-width="1" rx="4" />
    <!-- Pt100 Element inside tip -->
    <rect x="82" y="155" width="16" height="35" rx="3" fill="#ef4444" stroke="#fca5a5" stroke-width="1" />
    <text x="90" y="177" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Pt100</text>
    <text x="90" y="215" fill="#ef4444" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">100Ω @ 0°C</text>
    <text x="90" y="240" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">דיוק גבוה ויציבות לאורך זמן</text>
  </g>

  <!-- Middle: 3-Wire Connection Cables with Resistance Labels -->
  <g transform="translate(240, 70)">
    <rect x="0" y="0" width="420" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="210" y="25" fill="#38bdf8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">גשר מדידה (Wheatstone Bridge) ופיצוי גידים</text>

    <!-- Wire 1 (Red) -->
    <path d="M 0 70 L 120 70" stroke="#ef4444" stroke-width="3" />
    <!-- Wire 1 Resistor symbol representing lead wire resistance -->
    <rect x="120" y="62" width="40" height="16" fill="#334155" stroke="#ef4444" stroke-width="1.5" />
    <text x="140" y="74" fill="#fca5a5" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">R_L1</text>
    <path d="M 160 70 L 260 70" stroke="#ef4444" stroke-width="3" />
    <text x="50" y="60" fill="#fca5a5" font-family="Arial, sans-serif" font-size="10" font-weight="bold">חוט 1 (Lead 1)</text>

    <!-- Wire 2 (Red - return) -->
    <path d="M 0 130 L 120 130" stroke="#ef4444" stroke-width="3" />
    <!-- Wire 2 Resistor symbol -->
    <rect x="120" y="122" width="40" height="16" fill="#334155" stroke="#ef4444" stroke-width="1.5" />
    <text x="140" y="134" fill="#fca5a5" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">R_L2</text>
    <path d="M 160 130 L 260 130" stroke="#ef4444" stroke-width="3" />
    <text x="50" y="120" fill="#fca5a5" font-family="Arial, sans-serif" font-size="10" font-weight="bold">חוט 2 (Lead 2)</text>

    <!-- Wire 3 (White - compensation wire) -->
    <path d="M 0 190 L 120 190" stroke="#38bdf8" stroke-width="3" />
    <!-- Wire 3 Resistor symbol -->
    <rect x="120" y="182" width="40" height="16" fill="#334155" stroke="#38bdf8" stroke-width="1.5" />
    <text x="140" y="194" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">R_L3</text>
    <path d="M 160 190 L 260 190" stroke="#38bdf8" stroke-width="3" />
    <text x="50" y="180" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="10" font-weight="bold">חוט 3 (Lead 3 - פיצוי)</text>

    <!-- Bridge Circuit Box on Right -->
    <rect x="260" y="45" width="145" height="175" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="332" y="70" fill="#60a5fa" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">כרטיס קלט / משדר</text>
    
    <!-- Balance Formula in Bridge Box -->
    <text x="332" y="105" fill="#f8fafc" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">R_L1 ≈ R_L2 ≈ R_L3</text>
    <text x="332" y="130" fill="#10b981" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">קיזוז מלא של השפעת</text>
    <text x="332" y="148" fill="#10b981" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">אורך המוליכים!</text>
    
    <!-- Status indicator -->
    <rect x="275" y="170" width="115" height="35" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <text x="332" y="192" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Zero Error Balance</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <rect x="40" y="340" width="620" height="25" rx="5" fill="#1e293b" />
  <text x="350" y="357" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">בחיבור 3-חוטים, התנגדות חוטי ההולכה R_L1 ו-R_L2 מתקזזות בזרועות מנוגדות של הגשר ומונעות שגיאת חום מזויפת</text>
</svg>
