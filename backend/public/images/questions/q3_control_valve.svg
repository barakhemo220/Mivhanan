<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <rect width="700" height="380" rx="12" fill="#0f172a" />
  <rect x="1" y="1" width="698" height="378" rx="11" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Title Badge -->
  <rect x="20" y="15" width="310" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="175" y="35" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">שסתום בקרה פנאומטי: מבנה ומצב כשל Fail-Safe</text>

  <!-- Actuator Top Housing (Diaphragm Chamber) -->
  <g transform="translate(140, 55)">
    <!-- Air Supply Port at Top -->
    <rect x="90" y="0" width="20" height="25" fill="#f59e0b" stroke="#fbbf24" stroke-width="1" />
    <path d="M 100 0 L 100 25" stroke="#0f172a" stroke-width="3" />
    <text x="100" y="-8" fill="#f59e0b" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Air Signal In (3-15 PSI)</text>
    <path d="M 100 10 L 100 20 M 96 16 L 100 20 L 104 16" stroke="#0f172a" stroke-width="2" fill="none" />

    <!-- Dome upper casing -->
    <path d="M 10 45 C 10 25, 190 25, 190 45 Z" fill="#475569" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Flexible Diaphragm -->
    <path d="M 10 45 Q 100 55 190 45" stroke="#38bdf8" stroke-width="4" fill="none" />
    <text x="235" y="48" fill="#38bdf8" font-family="Arial, sans-serif" font-size="10" font-weight="bold">דיאפרגמה גמישה</text>

    <!-- Diaphragm Plate & Stem Attachment -->
    <rect x="60" y="48" width="80" height="8" rx="2" fill="#cbd5e1" />

    <!-- Lower Actuator Casing -->
    <path d="M 10 45 C 10 75, 190 75, 190 45" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Springs inside Yoke pushing UP -->
    <!-- Actuator Stem -->
    <rect x="96" y="56" width="8" height="110" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
    <!-- Spring coils -->
    <path d="M 70 65 Q 90 75 70 85 Q 90 95 70 105 Q 90 115 70 125 Q 90 135 70 145" stroke="#f59e0b" stroke-width="3.5" fill="none" />
    <path d="M 130 65 Q 110 75 130 85 Q 110 95 130 105 Q 110 115 130 125 Q 110 135 130 145" stroke="#f59e0b" stroke-width="3.5" fill="none" />
    <text x="35" y="105" fill="#f59e0b" font-family="Arial, sans-serif" font-size="10" font-weight="bold">קפיץ החזרה</text>
    <text x="35" y="120" fill="#f59e0b" font-family="Arial, sans-serif" font-size="9">(דוחף מעלה)</text>

    <!-- Valve Body at Bottom -->
    <g transform="translate(0, 160)">
      <!-- Bonnet / Packing -->
      <rect x="85" y="0" width="30" height="30" fill="#475569" stroke="#64748b" stroke-width="1" />
      <text x="145" y="18" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">אטם מוט (Packing)</text>

      <!-- Main Valve Body Pipe Housing -->
      <path d="M 0 50 L 50 50 L 50 30 L 150 30 L 150 50 L 200 50 L 200 110 L 150 110 L 150 90 L 50 90 L 50 110 L 0 110 Z" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="2" />
      <!-- Orifice seat & Plug -->
      <rect x="90" y="60" width="20" height="15" fill="#ef4444" stroke="#fca5a5" stroke-width="1" />
      <line x1="100" y1="20" x2="100" y2="60" stroke="#e2e8f0" stroke-width="6" />
      <text x="100" y="128" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">גוף השסתום (Globe Valve)</text>
    </g>
  </g>

  <!-- Right Side: Fail Action Analysis Card -->
  <g transform="translate(420, 60)">
    <rect x="0" y="0" width="250" height="280" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="125" y="30" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ניתוח פעולת כשל (Air Failure)</text>

    <!-- Mode: Air to Close -->
    <rect x="15" y="50" width="220" height="60" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="125" y="72" fill="#fbbf24" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">הזנת אוויר: Air-to-Close (ATC)</text>
    <text x="125" y="92" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">האוויר מפעיל לחץ כלפי מטה וסוגר</text>

    <!-- Arrow down -->
    <path d="M 125 115 L 125 130 M 120 125 L 125 130 L 130 125" stroke="#94a3b8" stroke-width="2" fill="none" />

    <!-- Result on Air Loss -->
    <rect x="15" y="135" width="220" height="120" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="125" y="160" fill="#34d399" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">בעת ניתוק אוויר (Fail Safe):</text>
    <text x="125" y="188" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">FAIL OPEN (FO)</text>
    <text x="125" y="210" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">הקפיץ מעלה את המוט</text>
    <text x="125" y="228" fill="#38bdf8" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">מעבר הזורם נפתח במלואו 100%</text>
  </g>
</svg>
