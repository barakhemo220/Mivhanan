<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="fluidRad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
  </defs>

  <rect width="700" height="380" rx="12" fill="#0f172a" />
  <rect x="1" y="1" width="698" height="378" rx="11" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Title Badge -->
  <rect x="20" y="15" width="310" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="175" y="35" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">מד ספיקה אלקטרומגנטי (Magmeter) - חוק פאראדיי</text>

  <!-- Cross section of pipe and coils -->
  <g transform="translate(180, 50)">
    <!-- Top Magnetic Coil (Electromagnet North) -->
    <rect x="80" y="0" width="100" height="35" rx="4" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5" />
    <text x="130" y="23" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">סליל עליון (N)</text>

    <!-- Bottom Magnetic Coil (Electromagnet South) -->
    <rect x="80" y="215" width="100" height="35" rx="4" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5" />
    <text x="130" y="238" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">סליל תחתון (S)</text>

    <!-- Magnetic Field Lines (B vector pointing down) -->
    <g stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3">
      <line x1="95" y1="35" x2="95" y2="215" />
      <line x1="115" y1="35" x2="115" y2="215" />
      <line x1="130" y1="35" x2="130" y2="215" stroke-width="3" />
      <line x1="145" y1="35" x2="145" y2="215" />
      <line x1="165" y1="35" x2="165" y2="215" />
    </g>
    <text x="145" y="125" fill="#f59e0b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">B (שדה מגנטי)</text>

    <!-- Pipe Outer Ring (Steel) -->
    <circle cx="130" cy="125" r="80" fill="url(#pipeWall)" stroke="#64748b" stroke-width="3" />
    <!-- Insulating Liner (PTFE / Rubber) -->
    <circle cx="130" cy="125" r="70" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="6,2" />
    <text x="130" y="60" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">ציפוי מבודד (Liner)</text>

    <!-- Conductive Fluid Core -->
    <circle cx="130" cy="125" r="68" fill="url(#fluidRad)" opacity="0.6" />
    <text x="130" y="195" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">נוזל מוליך (σ ≥ 5 μS/cm)</text>

    <!-- Electrodes (Left and Right) -->
    <!-- Left Electrode -->
    <rect x="52" y="117" width="16" height="16" rx="3" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
    <path d="M 52 125 L 10 125 L 10 280 L 100 280" fill="none" stroke="#facc15" stroke-width="2" />

    <!-- Right Electrode -->
    <rect x="192" y="117" width="16" height="16" rx="3" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
    <path d="M 208 125 L 250 125 L 250 280 L 160 280" fill="none" stroke="#facc15" stroke-width="2" />

    <!-- Millivoltmeter across electrodes -->
    <circle cx="130" cy="280" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="130" y="278" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">mV</text>
    <text x="130" y="293" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">מתח מושרה E</text>
  </g>

  <!-- Formula & Theory Card on Right -->
  <g transform="translate(470, 60)">
    <rect x="0" y="0" width="200" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="100" y="28" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">חוק ההשראה של פאראדיי</text>

    <rect x="15" y="45" width="170" height="50" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="100" y="76" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">E = B · D · v</text>

    <!-- Legend breakdown -->
    <g transform="translate(15, 110)">
      <text x="0" y="15" fill="#f59e0b" font-family="Arial, sans-serif" font-size="11">E : מתח מושרה באלקטרודות</text>
      <text x="0" y="35" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11">B : עוצמת השדה המגנטי</text>
      <text x="0" y="55" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">D : המרחק בין האלקטרודות</text>
      <text x="0" y="75" fill="#10b981" font-family="Arial, sans-serif" font-size="11">v : מהירות הזרימה הממוצעת</text>
    </g>

    <!-- Critical Requirement Badge -->
    <rect x="15" y="195" width="170" height="25" rx="4" fill="#065f46" />
    <text x="100" y="212" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">חובה: מוליכות חשמלית בנוזל!</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <rect x="40" y="325" width="620" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="350" y="350" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">נוזלים ללא מוליכות חשמלית (כגון פחמימנים, נפט, שמן, ומים מזוקקים טהורים) אינם יכולים לייצר מתח מושרה במד מגנטי</text>
</svg>
