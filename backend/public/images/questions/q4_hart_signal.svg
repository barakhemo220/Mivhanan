<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <rect width="700" height="380" rx="12" fill="#0f172a" />
  <rect x="1" y="1" width="698" height="378" rx="11" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Title Badge -->
  <rect x="20" y="15" width="310" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="175" y="35" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">פרוטוקול תקשורת שדה: אות 4-20mA עם HART FSK</text>

  <!-- Oscilloscope / Waveform Display Screen -->
  <g transform="translate(40, 65)">
    <rect x="0" y="0" width="620" height="210" rx="8" fill="#020617" stroke="#1e293b" stroke-width="2" />

    <!-- Grid lines -->
    <g stroke="#0f172a" stroke-width="1.5">
      <line x1="0" y1="35" x2="620" y2="35" />
      <line x1="0" y1="70" x2="620" y2="70" />
      <line x1="0" y1="105" x2="620" y2="105" stroke="#1e293b" stroke-width="2" />
      <line x1="0" y1="140" x2="620" y2="140" />
      <line x1="0" y1="175" x2="620" y2="175" />
      
      <line x1="100" y1="0" x2="100" y2="210" />
      <line x1="200" y1="0" x2="200" y2="210" />
      <line x1="300" y1="0" x2="300" y2="210" />
      <line x1="400" y1="0" x2="400" y2="210" />
      <line x1="500" y1="0" x2="500" y2="210" />
    </g>

    <!-- DC Analog Signal 12mA (Baseline Level) -->
    <line x1="20" y1="105" x2="600" y2="105" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" />
    <text x="50" y="95" fill="#38bdf8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">אות אנלוגי רציף: 12.0 mA (50% Process Variable)</text>

    <!-- Superimposed HART FSK Sine Waveform -->
    <!-- Bit 1: 1200 Hz (wider wavelength) -->
    <!-- Bit 0: 2200 Hz (narrower wavelength) -->
    <path d="M 20 105 
             Q 45 75 70 105 Q 95 135 120 105 Q 145 75 170 105 Q 195 135 220 105 
             Q 235 80 250 105 Q 265 130 280 105 Q 295 80 310 105 Q 325 130 340 105 Q 355 80 370 105 Q 385 130 400 105
             Q 425 75 450 105 Q 475 135 500 105 Q 525 75 550 105 Q 575 135 600 105" 
          stroke="#facc15" stroke-width="3" fill="none" />

    <!-- Wave Amplitude Bracket (0.5 mA p-p) -->
    <line x1="605" y1="75" x2="605" y2="135" stroke="#ec4899" stroke-width="1.5" />
    <text x="615" y="110" fill="#ec4899" font-family="Arial, sans-serif" font-size="10" font-weight="bold">±0.5 mA</text>

    <!-- Bit 1 Label -->
    <rect x="50" y="160" width="140" height="35" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="120" y="177" fill="#f8fafc" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Bit '1' = 1200 Hz</text>
    <text x="120" y="190" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">(תדר נמוך - 1 מחזור)</text>

    <!-- Bit 0 Label -->
    <rect x="240" y="160" width="150" height="35" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="315" y="177" fill="#f8fafc" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Bit '0' = 2200 Hz</text>
    <text x="315" y="190" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">(תדר גבוה - 2 מחזורים)</text>

    <!-- Average DC Zero Label -->
    <rect x="440" y="160" width="150" height="35" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <text x="515" y="177" fill="#34d399" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DC Average = 0.0 mA</text>
    <text x="515" y="190" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">אפס הפרעה למדידה</text>
  </g>

  <!-- Bottom Explanatory Card -->
  <g transform="translate(40, 290)">
    <rect x="0" y="0" width="620" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="310" y="24" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">עקרון פעולה: Bell 202 Frequency Shift Keying (FSK)</text>
    <text x="310" y="45" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">האות הדיגיטלי סינוסואידלי וממורכז סביב אפס זרם, ולכן רכיב הסינון ב-PLC קורא 12.0mA טהור ללא שגיאה</text>
  </g>
</svg>
