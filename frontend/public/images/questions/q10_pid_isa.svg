<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <rect width="700" height="380" rx="12" fill="#0f172a" />
  <rect x="1" y="1" width="698" height="378" rx="11" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Title Badge -->
  <rect x="20" y="15" width="310" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="175" y="35" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">שרטוט P&amp;ID תקני: סימולים לפי תקן ISA-5.1</text>

  <!-- P&ID Diagram Graphic -->
  <g transform="translate(40, 60)">
    <!-- Process Pipe Line -->
    <line x1="20" y1="200" x2="420" y2="200" stroke="#64748b" stroke-width="5" />
    <polygon points="120,195 135,200 120,205" fill="#64748b" />
    <text x="70" y="220" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">קו תהליך (Process Pipe)</text>

    <!-- PT-101: Field mounted Pressure Transmitter (Plain circle, no line) -->
    <line x1="160" y1="200" x2="160" y2="135" stroke="#94a3b8" stroke-width="2" />
    <circle cx="160" cy="110" r="26" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />
    <text x="160" y="115" fill="#f59e0b" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PT-101</text>
    <text x="160" y="70" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">עיגול ריק = בשטח (Field)</text>

    <!-- Electrical Signal from PT-101 to PIC-101 (Dashed line) -->
    <path d="M 186 110 L 260 110" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5,4" />
    <text x="223" y="100" fill="#38bdf8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">4-20mA</text>

    <!-- PIC-101: Main Panel/DCS Accessible (Circle with solid horizontal line in center) -->
    <circle cx="290" cy="110" r="32" fill="#0f172a" stroke="#10b981" stroke-width="3" />
    <!-- Solid horizontal dividing line (ISA 5.1 Main Panel symbol) -->
    <line x1="258" y1="110" x2="322" y2="110" stroke="#10b981" stroke-width="2.5" />
    <text x="290" y="102" fill="#34d399" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PIC</text>
    <text x="290" y="128" fill="#34d399" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">101</text>
    
    <!-- Pointer to PIC-101 horizontal line -->
    <path d="M 290 55 L 290 75" stroke="#facc15" stroke-width="2" marker-end="url(#arrow)" />
    <text x="290" y="45" fill="#facc15" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">קו רציף חוצה במרכז</text>

    <!-- Signal from PIC-101 to PCV-101 (Pneumatic signal or electric) -->
    <path d="M 322 110 L 370 110 L 370 170" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />

    <!-- PCV-101 (Pressure Control Valve on Pipe) -->
    <g transform="translate(370, 200)">
      <!-- Valve body (Bowtie) -->
      <polygon points="-25,-12 0,0 -25,12" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5" />
      <polygon points="25,-12 0,0 25,12" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#cbd5e1" stroke-width="3" />
      <!-- Diaphragm actuator -->
      <path d="M -15 -20 C -15 -35, 15 -35, 15 -20 Z" fill="#475569" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="0" y="30" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PCV-101</text>
    </g>
  </g>

  <!-- Legend Card on Right: ISA-5.1 Rules -->
  <g transform="translate(480, 60)">
    <rect x="0" y="0" width="190" height="235" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="95" y="25" fill="#38bdf8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">כללי תקן ISA-5.1</text>

    <g transform="translate(15, 45)">
      <text x="0" y="15" fill="#facc15" font-family="Arial, sans-serif" font-size="11" font-weight="bold">P : Pressure (לחץ)</text>
      <text x="0" y="35" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">I : Indicator (תצוגה)</text>
      <text x="0" y="55" fill="#10b981" font-family="Arial, sans-serif" font-size="11" font-weight="bold">C : Controller (בקר)</text>
      
      <line x1="0" y1="70" x2="160" y2="70" stroke="#334155" stroke-width="1" />

      <!-- Meaning of lines -->
      <text x="0" y="90" fill="#f8fafc" font-family="Arial, sans-serif" font-size="10" font-weight="bold">משמעות הקווים בעיגול:</text>
      <text x="0" y="110" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">• ללא קו: מותקן בשטח</text>
      <text x="0" y="128" fill="#34d399" font-family="Arial, sans-serif" font-size="9" font-weight="bold">• קו רציף: לוח ראשי / DCS נגיש למפעיל</text>
      <text x="0" y="146" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">• קו מקווקו: מאחורי לוח (נסתר)</text>
    </g>
  </g>

  <!-- Bottom Explanatory Card -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="620" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="310" y="24" fill="#34d399" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">הסמל 'PIC' עם קו רציף במרכז = בקר ואינדיקטור לחץ בלוח הבקרה הראשי (Panel Mounted) נגיש ישירות למפעיל</text>
    <text x="310" y="40" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">המערכת קוראת אות ממשדר הלחץ בשטח (PT) ומווסתת את שסתום הבקרה (PCV) לחוג סגור מלא</text>
  </g>
</svg>
