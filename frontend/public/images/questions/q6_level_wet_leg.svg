<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <linearGradient id="tankFluid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="wetLegFluid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <rect width="700" height="380" rx="12" fill="#0f172a" />
  <rect x="1" y="1" width="698" height="378" rx="11" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Title Badge -->
  <rect x="20" y="15" width="310" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="175" y="35" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">מדידת מפלס: מיכל סגור בלחץ עם רגל רטובה (Wet Leg)</text>

  <!-- Pressurized Tank -->
  <g transform="translate(60, 60)">
    <!-- Tank Body Outline -->
    <rect x="30" y="20" width="180" height="220" rx="40" fill="#1e293b" stroke="#64748b" stroke-width="2.5" />
    
    <!-- Vapor space at top -->
    <text x="120" y="55" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">לחץ אדים (P_vapor)</text>

    <!-- Liquid in Tank (Level h) -->
    <path d="M 32 140 Q 120 135 208 140 L 208 200 C 208 220 190 238 170 238 L 70 238 C 50 238 32 220 32 200 Z" fill="url(#tankFluid)" />
    <text x="120" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">נוזל התהליך (מפלס h)</text>

    <!-- Level Height Arrow -->
    <line x1="225" y1="140" x2="225" y2="238" stroke="#38bdf8" stroke-width="2" />
    <text x="240" y="195" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">h</text>

    <!-- High side tap at bottom of tank -->
    <path d="M 120 238 L 120 280 L 320 280" fill="none" stroke="#ef4444" stroke-width="3" />
    <text x="170" y="272" fill="#ef4444" font-family="Arial, sans-serif" font-size="11" font-weight="bold">צד High (P_H = P_v + ρ·g·h)</text>
  </g>

  <!-- Wet Leg (Reference Column) from top of tank -->
  <g transform="translate(60, 60)">
    <!-- Top vapor tap connection -->
    <path d="M 120 20 L 120 5 L 290 5 L 290 280 L 320 280" fill="none" stroke="#0284c7" stroke-width="8" stroke-linejoin="round" />
    <path d="M 120 20 L 120 5 L 290 5 L 290 280 L 320 280" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Wet Leg Label -->
    <rect x="305" y="60" width="120" height="40" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <text x="365" y="78" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">רגל רטובה מלאה</text>
    <text x="365" y="93" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">(Wet Leg Reference)</text>

    <!-- Low side label -->
    <text x="305" y="260" fill="#0284c7" font-family="Arial, sans-serif" font-size="11" font-weight="bold">צד Low (P_L = P_v + ρ·g·H_ref)</text>
  </g>

  <!-- Differential Pressure Transmitter (DP) -->
  <g transform="translate(420, 310)">
    <circle cx="40" cy="30" r="28" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2" />
    <text x="40" y="27" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ΔP</text>
    <text x="40" y="42" fill="#93c5fd" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">LT-102</text>
  </g>

  <!-- Right Analysis Card: Calibration at Tank Empty -->
  <g transform="translate(480, 60)">
    <rect x="0" y="0" width="190" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="95" y="25" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">מצב מיכל ריק (h = 0)</text>

    <rect x="15" y="45" width="160" height="45" rx="5" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="25" y="65" fill="#fca5a5" font-family="Arial, sans-serif" font-size="11">P_High = P_vapor</text>
    <text x="25" y="80" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">אין עמוד נוזל במיכל</text>

    <rect x="15" y="100" width="160" height="45" rx="5" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <text x="25" y="120" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="11">P_Low = P_v + ρ·g·H</text>
    <text x="25" y="135" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">עמוד רפרנס מלא קבוע</text>

    <!-- Delta P result -->
    <rect x="15" y="155" width="160" height="60" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="95" y="175" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ΔP = P_H - P_L &lt; 0</text>
    <text x="95" y="195" fill="#10b981" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">כיול Zero Elevation!</text>
  </g>
</svg>
