<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <rect width="700" height="380" rx="12" fill="#0f172a" />
  <rect x="1" y="1" width="698" height="378" rx="11" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Title Badge -->
  <rect x="20" y="15" width="310" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="175" y="35" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">מערכות בטיחות תהליכית: רמות SIL (תקן IEC 61508/61511)</text>

  <!-- SIL Pyramid on the Left -->
  <g transform="translate(60, 65)">
    <!-- SIL 4 -->
    <polygon points="120,10 80,60 160,60" fill="#dc2626" stroke="#fca5a5" stroke-width="1.5" />
    <text x="120" y="45" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SIL 4</text>

    <!-- SIL 3 -->
    <polygon points="80,60 160,60 190,110 50,110" fill="#ea580c" stroke="#fdba74" stroke-width="1.5" />
    <text x="120" y="92" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SIL 3</text>

    <!-- SIL 2 -->
    <polygon points="50,110 190,110 220,165 20,165" fill="#d97706" stroke="#fde047" stroke-width="1.5" />
    <text x="120" y="145" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SIL 2</text>

    <!-- SIL 1 -->
    <polygon points="20,165 220,165 245,225 -5,225" fill="#2563eb" stroke="#93c5fd" stroke-width="1.5" />
    <text x="120" y="202" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SIL 1</text>
  </g>

  <!-- Table Matrix on Right: PFD and Risk Reduction Factor (RRF) -->
  <g transform="translate(340, 65)">
    <!-- Table Header -->
    <rect x="0" y="0" width="320" height="35" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="40" y="22" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">רמת SIL</text>
    <text x="135" y="22" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">הסתברות לכשל PFD_avg</text>
    <text x="255" y="22" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">הפחתת סיכון RRF</text>

    <!-- Row SIL 1 -->
    <rect x="0" y="42" width="320" height="40" rx="4" fill="#0f172a" stroke="#2563eb" stroke-width="1" />
    <text x="40" y="67" fill="#60a5fa" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SIL 1</text>
    <text x="135" y="67" fill="#f8fafc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">10⁻¹ עד 10⁻²</text>
    <text x="255" y="67" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">10 עד 100</text>

    <!-- Row SIL 2 (Highlighted) -->
    <rect x="0" y="88" width="320" height="45" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="40" y="115" fill="#fbbf24" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SIL 2</text>
    <text x="135" y="115" fill="#facc15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">10⁻² עד 10⁻³ (פי 10!)</text>
    <text x="255" y="115" fill="#34d399" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100 עד 1,000</text>

    <!-- Row SIL 3 -->
    <rect x="0" y="139" width="320" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="40" y="164" fill="#fb923c" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">SIL 3</text>
    <text x="135" y="164" fill="#f8fafc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">10⁻³ עד 10⁻⁴</text>
    <text x="255" y="164" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">1,000 עד 10,000</text>

    <!-- Row SIL 4 -->
    <rect x="0" y="185" width="320" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="40" y="210" fill="#f87171" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">SIL 4</text>
    <text x="135" y="210" fill="#f8fafc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">10⁻⁴ עד 10⁻⁵</text>
    <text x="255" y="210" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">10,000 עד 100,000</text>
  </g>

  <!-- Bottom Explanatory Card -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="620" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="310" y="23" fill="#fbbf24" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">שדרוג מ-SIL 1 ל-SIL 2 מפחית את ההסתברות לכשל לפי דרישה (PFD) פי 10 (סדר גודל שלם)</text>
    <text x="310" y="40" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">ומעלה את פקטור הפחתת הסיכון מ-100 ל-1,000 באמצעות יתירות חומרה וזמני בדיקת הוכחה קצרים</text>
  </g>
</svg>
