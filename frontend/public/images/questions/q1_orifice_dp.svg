<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="txGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="380" rx="12" fill="#0f172a" />
  <rect x="1" y="1" width="698" height="378" rx="11" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Grid pattern -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="380" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="250" y1="0" x2="250" y2="380" />
    <line x1="350" y1="0" x2="350" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="550" y1="0" x2="550" y2="380" />
    <line x1="650" y1="0" x2="650" y2="380" />
    <line x1="0" y1="60" x2="700" y2="60" />
    <line x1="0" y1="160" x2="700" y2="160" />
    <line x1="0" y1="260" x2="700" y2="260" />
  </g>

  <!-- Title Badge -->
  <rect x="20" y="15" width="260" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="150" y="35" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">מדידת ספיקה: Orifice Plate ו-ΔP Transmitter</text>

  <!-- Main Pipe -->
  <rect x="40" y="75" width="620" height="70" fill="url(#pipeGrad)" stroke="#64748b" stroke-width="2" />
  <!-- Fluid stream inside pipe -->
  <rect x="40" y="83" width="620" height="54" fill="url(#flowGrad)" />

  <!-- Flow Direction Arrows -->
  <path d="M 60 110 L 100 110 M 90 102 L 100 110 L 90 118" stroke="#38bdf8" stroke-width="2.5" fill="none" />
  <text x="80" y="98" fill="#38bdf8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Flow (Q)</text>
  <path d="M 540 110 L 580 110 M 570 102 L 580 110 L 570 118" stroke="#38bdf8" stroke-width="2.5" fill="none" />
  <text x="560" y="98" fill="#38bdf8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Flow (Q)</text>

  <!-- Orifice Plate Flanges -->
  <rect x="300" y="65" width="12" height="90" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1" />
  <rect x="320" y="65" width="12" height="90" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1" />
  <!-- Orifice Plate Disc -->
  <rect x="312" y="60" width="8" height="100" fill="#e2e8f0" stroke="#f8fafc" stroke-width="1" />
  <!-- Orifice Plate Bore / Restriction -->
  <rect x="312" y="98" width="8" height="24" fill="#0284c7" />
  <text x="316" y="52" fill="#f8fafc" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Orifice Plate</text>

  <!-- Pressure Taps -->
  <!-- High Pressure Tap (Upstream) -->
  <rect x="230" y="145" width="10" height="40" fill="#64748b" />
  <path d="M 235 185 L 235 240 L 310 240" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,2" />
  <text x="210" y="175" fill="#f59e0b" font-family="Arial, sans-serif" font-size="11" font-weight="bold">High (P₁)</text>

  <!-- Low Pressure Tap (Downstream) -->
  <rect x="390" y="145" width="10" height="40" fill="#64748b" />
  <path d="M 395 185 L 395 240 L 370 240" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,2" />
  <text x="410" y="175" fill="#10b981" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Low (P₂)</text>

  <!-- DP Transmitter -->
  <circle cx="340" cy="245" r="32" fill="url(#txGrad)" stroke="#60a5fa" stroke-width="2.5" filter="url(#glow)" />
  <text x="340" y="240" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DP</text>
  <text x="340" y="258" fill="#93c5fd" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">FT-101</text>
  <line x1="315" y1="245" x2="365" y2="245" stroke="#93c5fd" stroke-width="1" />

  <!-- Signal Output to PLC -->
  <path d="M 340 277 L 340 330 L 480 330" fill="none" stroke="#38bdf8" stroke-width="2" />
  <text x="410" y="322" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">4-20 mA (Square Root)</text>

  <!-- Pressure Profile Graph on Bottom Left -->
  <rect x="40" y="200" width="170" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="125" y="220" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">פרופיל לחץ לאורך הצינור</text>
  <!-- Axes -->
  <line x1="55" y1="330" x2="195" y2="330" stroke="#64748b" stroke-width="1.5" />
  <line x1="55" y1="330" x2="55" y2="230" stroke="#64748b" stroke-width="1.5" />
  <!-- Curve showing pressure drop -->
  <path d="M 55 250 L 105 250 C 115 250, 120 310, 130 310 C 145 310, 160 275, 195 275" fill="none" stroke="#ef4444" stroke-width="2.5" />
  <line x1="105" y1="235" x2="105" y2="330" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" />
  <text x="105" y="235" fill="#f59e0b" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">P₁</text>
  <text x="135" y="325" fill="#10b981" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">P₂</text>
  <!-- Delta P label -->
  <line x1="90" y1="250" x2="90" y2="310" stroke="#facc15" stroke-width="1.5" />
  <text x="80" y="285" fill="#facc15" font-family="Arial, sans-serif" font-size="10" font-weight="bold">ΔP</text>

  <!-- Formula Highlight Card on Right -->
  <rect x="490" y="200" width="180" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="580" y="225" fill="#38bdf8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">נוסחת עקרון ברנולי</text>
  <text x="580" y="260" fill="#f8fafc" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Q = K · √(ΔP / ρ)</text>
  <line x1="510" y1="275" x2="650" y2="275" stroke="#334155" stroke-width="1" />
  <text x="580" y="300" fill="#f59e0b" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ΔP ∝ Q²</text>
  <text x="580" y="325" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">אם Q גדל פי 2 ← ΔP גדל פי 4</text>
</svg>
